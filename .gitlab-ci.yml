stages:
  - fair-assessment

variables:
  PYTHONUNBUFFERED: "1"
  FUJI_API_URL: "http://10.8.244.43:1071/fuji/api/v1"
  EDP_DISCOVERY_URL: "https://edp-portal.eurac.edu/discovery/"
  FUJI_ONLY_MISSING: "false"
  FUJI_SLEEP: "2"
  FUJI_TIMEOUT: "180"

fair_scores:
  stage: fair-assessment
  tags:
    - feed_edp_portal_db_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - |
      set -euxo pipefail

      echo "=== System ==="
      cat /etc/os-release
      uname -a

      echo "=== Python runtime ==="
      command -v python3
      python3 --version

      echo "=== Install dependencies ==="
      python3 -m pip install --user --quiet --upgrade pip
      python3 -m pip install --user --quiet requests psycopg2-binary
  script:
    - |
      set -o pipefail

      echo "=== Syntax check ==="
      python3 -m py_compile scripts/run_fuji_fair_scores.py

      echo "=== Run FAIR assessment ==="
      python3 scripts/run_fuji_fair_scores.py 2>&1 | tee fuji-fair-scores.log
  after_script:
    - |
      echo "=== Last log lines ==="
      if [ -f fuji-fair-scores.log ]; then
        tail -n 100 fuji-fair-scores.log
      fi
  artifacts:
    when: always
    paths:
      - fuji-fair-scores.log
    expire_in: 7 days
  timeout: 6h
