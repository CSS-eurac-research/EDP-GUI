stages:
  - fair-assessment

variables:
  PYTHONUNBUFFERED: "1"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  FUJI_API_URL: "http://10.8.244.43:1071/fuji/api/v1"
  EDP_DISCOVERY_URL: "https://edp-portal.eurac.edu/discovery/"
  FUJI_ONLY_MISSING: "false"
  FUJI_SLEEP: "2"
  FUJI_TIMEOUT: "180"

fair_scores:
  stage: fair-assessment
  tags:
    - feed_edp_portal_db_cache
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - |
      set -euxo pipefail

      echo "=== System ==="
      cat /etc/os-release
      uname -a

      echo "=== Install/check uv ==="
      if ! command -v uv >/dev/null 2>&1; then
        curl -LsSf https://astral.sh/uv/install.sh | sh
      fi
      export PATH="$HOME/.local/bin:$PATH"

      uv --version

      echo "=== Install Python 3.10 ==="
      uv python install 3.10

      echo "=== Runtime ==="
      uv run --python 3.10 python --version

      echo "=== Install dependencies ==="
      uv run --python 3.10 python -m pip install --quiet requests psycopg2-binary
  script:
    - |
      set -o pipefail
      export PATH="$HOME/.local/bin:$PATH"

      echo "=== Syntax check ==="
      uv run --python 3.10 python -m py_compile scripts/run_fuji_fair_scores.py

      echo "=== Run FAIR assessment ==="
      uv run --python 3.10 python scripts/run_fuji_fair_scores.py 2>&1 | tee fuji-fair-scores.log
  after_script:
    - |
      echo "=== Last log lines ==="
      if [ -f fuji-fair-scores.log ]; then
        tail -n 100 fuji-fair-scores.log
      fi
  cache:
    key: uv-cache
    paths:
      - .uv-cache/
  artifacts:
    when: always
    paths:
      - fuji-fair-scores.log
    expire_in: 7 days
  timeout: 6h
