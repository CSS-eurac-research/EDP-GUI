# VM / staging deployment (shared host).
# Usage:
#   cp .env.vm.example .env
#   sudo docker compose -f docker-compose.vm.yml -p edp-dev up -d --build
#   sudo docker compose -f docker-compose.vm.yml -p edp-dev exec web python manage.py migrate

services:
  db:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ${DB_NAME:-edp_portal_gui}
      POSTGRES_USER: ${DB_USER:-edp_gui_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-edp_gui_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn edp_interface.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    ports:
      - "${WEB_HOST_PORT:-8083}:8000"
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_PROXY_ALLOWED_HOSTS: ${DJANGO_PROXY_ALLOWED_HOSTS:-127.0.0.1,localhost}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-}
      DB_ENGINE: ${DB_ENGINE:-django.contrib.gis.db.backends.postgis}
      DB_NAME: ${DB_NAME:-edp_portal_gui}
      DB_USER: ${DB_USER:-edp_gui_user}
      DB_PASSWORD: ${DB_PASSWORD:-edp_gui_pass}
      DB_HOST: ${DB_HOST:-10.8.244.39}
      DB_PORT: ${DB_PORT:-5432}
      GEONETWORK_BASE_URL: ${GEONETWORK_BASE_URL:-http://10.8.244.64:8080/geonetwork}
      EDP_DISCOVERY_URL: ${EDP_DISCOVERY_URL:-http://localhost:18080/discovery/}
      DOI_URL: ${DOI_URL:-https://doi.org/10.48784/}
      OPENEO_URL: ${OPENEO_URL:-https://openeo.eurac.edu/openeo/1.1.0/collections/}
      DATA_CITE_API: ${DATA_CITE_API:-https://api.datacite.org/dois/10.48784/}
      GEONETWORK_URL: ${GEONETWORK_URL:-https://edp-portal.eurac.edu/geonetwork/srv/api/records/}
      GEONETWORK_HARVEST_URL: ${GEONETWORK_HARVEST_URL:-http://edp-portal.eurac.edu/geonetwork/srv/eng/q?_content_type=json&summaryOnly=1}

    restart: unless-stopped

volumes:
  pgdata:
